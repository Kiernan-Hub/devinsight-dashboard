# The whole telemetry pipeline on one machine, with no Supabase or Vercel account.
#
#   docker compose up --build --wait     # start everything; returns once it is healthy
#   open http://localhost:8080           # the dashboard
#   npm run smoke                        # send a real sample through it and read it back
#   docker compose down                  # stop (add -v to also wipe the database)
#
# What runs, and which production piece each one stands in for:
#
#   gateway  nginx      ← Vercel's static hosting + Supabase's API gateway, on one origin
#   ingest   this repo  ← the Vercel Function (same api/ingest.js file, via server.mjs)
#   rest     PostgREST  ← Supabase's REST API (Supabase runs PostgREST itself)
#   db       Postgres   ← Supabase's database, built from supabase/schema.sql
#   keys     one-shot   ← Supabase's project API keys, generated fresh on this machine
#
# Only the gateway is reachable from outside Docker, and only from this machine (127.0.0.1).
#
# Every image is pinned to an exact digest (tag kept alongside for readability), so CI's smoke test
# runs against precisely what ran locally. Dependabot proposes digest bumps as pull requests.

name: devinsight

services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      # Local-only. The database port is not published, so this password is reachable only by
      # other containers in this file.
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once, on an empty volume, in filename order: Supabase's built-in roles first, then
      # the production schema itself, unmodified. If schema.sql fails, startup fails.
      - ./docker/db/00-supabase-roles.sql:/docker-entrypoint-initdb.d/00-supabase-roles.sql:ro
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      # TCP, not the Unix socket: during first-boot initialisation Postgres listens on the
      # socket only, so this stays unhealthy until the schema has actually been applied.
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30

  keys:
    image: node:24-alpine@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
    command: ["node", "/opt/local-keys.mjs", "/keys"]
    environment:
      # PostgREST and the ingest image both run as uid 1000; see scripts/local-keys.mjs.
      KEYS_OWNER: "1000:1000"
    volumes:
      - ./scripts/local-keys.mjs:/opt/local-keys.mjs:ro
      - keys:/keys

  rest:
    image: postgrest/postgrest:v16.4@sha256:d155c6718ed9a9f990d159a2ab7c0a3f16944dbb6d0a0344557421042acfe0df
    environment:
      PGRST_DB_URI: postgres://authenticator:authenticator@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      # "@path" tells PostgREST to read the value from a file: the secret never appears in this
      # file, the environment, or `docker inspect`.
      PGRST_JWT_SECRET: "@/keys/jwt-secret"
    volumes:
      - keys:/keys:ro
    depends_on:
      db:
        condition: service_healthy
      keys:
        condition: service_completed_successfully

  ingest:
    build: .
    image: devinsight-ingest:local
    environment:
      # Through the gateway, so the handler's /rest/v1/ paths resolve exactly as on Supabase.
      SUPABASE_URL: http://gateway
      SUPABASE_SERVICE_ROLE_KEY_FILE: /keys/service-role.jwt
      # Blank by default, which disables the token check. Set INGEST_TOKEN in a .env file next
      # to this one (see .env.example) to run with the same check production uses.
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    volumes:
      - keys:/keys:ro
    depends_on:
      keys:
        condition: service_completed_successfully

  gateway:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
    volumes:
      # nginx.conf and the local dashboard config. A directory rather than single files, for the
      # reason given at the top of nginx.conf; after editing nginx.conf, `docker compose restart
      # gateway` picks it up.
      - ./docker/gateway:/etc/nginx/conf.d:ro
      # The dashboard. nginx.conf serves an explicit allowlist out of this, never the whole
      # directory. Edits to the dashboard show up on a browser refresh.
      - .:/srv/repo:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      - rest
      - ingest

  # ---- Optional: monitoring --------------------------------------------------------------------
  # Not started by a plain `docker compose up`. Opt in with:
  #   docker compose --profile monitoring up -d --wait
  #   open http://localhost:3001     # Grafana: the "DevInsight — ingest service" dashboard
  # Prometheus scrapes ingest:8787/metrics over the internal network; neither /metrics nor
  # Prometheus is reachable through the public gateway.

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./docker/monitoring/prometheus:/etc/prometheus:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      - ingest

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    profiles: [monitoring]
    environment:
      # Read-only and login-free: anyone who can reach 127.0.0.1:3001 can view the dashboards and
      # nobody can log in to change them. Hiding the login form is not enough on its own — Grafana
      # still accepted its built-in admin/admin over the HTTP API (checked) — so the default admin
      # account is never created and password auth on the API is off too.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ingest.json
      # No phoning home from a local development tool.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      - prometheus

  # ---- Optional: load test ---------------------------------------------------------------------
  # npm run loadtest — see loadtest/ingest.js. Talks to the gateway over the internal network,
  # exactly as an outside client would reach /api/ingest.
  k6:
    image: grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34
    profiles: [loadtest]
    command: ["run", "--quiet", "/scripts/ingest.js"]
    environment:
      BASE_URL: http://gateway
      PEAK_RPS: ${PEAK_RPS:-400}
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    volumes:
      - ./loadtest:/scripts:ro
    depends_on:
      - gateway

volumes:
  db-data:
  keys:
