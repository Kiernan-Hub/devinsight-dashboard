# The local stack's single front door, on http://localhost:8080.
#
# Production is split across two hosts: Vercel serves the dashboard and /api/ingest, and
# Supabase serves the database's REST API under /rest/v1/. This gateway puts all three behind
# one origin, with the same paths. That buys two things:
#
#   - api/ingest.js runs unchanged. It calls `${SUPABASE_URL}/rest/v1/...`; PostgREST on its own
#     serves at `/`, not `/rest/v1/`. Supabase's gateway strips that prefix, so this one does too.
#   - The dashboard reads from its own origin, so the browser never makes a cross-origin request
#     and no CORS configuration is needed.

# nginx's built-in MIME table predates JavaScript modules and has no entry for .mjs. Browsers
# refuse to run a module served as application/octet-stream, so without this the dashboard
# would load as a blank page. (A second `types` block adds to the defaults; it does not replace
# them — checked against this exact image.)
types {
  application/javascript mjs;
}

server {
  listen 80;
  # The repository, mounted read-only. Mounted as a whole directory rather than file by file:
  # Docker pins a single-file mount to that file's inode, and most editors save by writing a new
  # file and renaming it over the old one — after which the container still points at the
  # deleted original and serves a 404. (This happened, on the first edit to index.html.)
  root /srv/repo;

  # The database's REST API, as Supabase exposes it. The trailing slash on proxy_pass is what
  # strips the /rest/v1 prefix.
  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
  }

  # The ingest function, at the same path Vercel serves it from. 1 MB matches the ingest
  # server's own transport limit; the handler's tighter 256 KB check still runs behind it.
  location /api/ {
    client_max_body_size 1m;
    proxy_pass http://ingest:8787;
    proxy_set_header Host $host;
  }

  # The dashboard's data source. Production loads config.js from the repository (the Supabase
  # project URL and its public anon key); locally the same path serves an override that points
  # the dashboard at this gateway instead. index.html is identical in both.
  location = /config.js {
    alias /etc/nginx/conf.d/config.local.js;
    add_header Cache-Control "no-store";
  }

  # Exactly the files the dashboard loads, and nothing else. The whole repository is mounted, but
  # only this allowlist is served: HANDOFF.md, the schema, a local .env, and ascent/ (the game,
  # kept out of this repository's public surface on purpose) all 404.
  location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-store";
  }
  location = /index.html          { add_header Cache-Control "no-store"; }
  location = /build-manifest.json { add_header Cache-Control "no-store"; }
  location = /scripts/dashboard-core.mjs { add_header Cache-Control "no-store"; }
  location /vendor/ {}
  location /assets/ {}
  location = /openapi.json        { add_header Cache-Control "no-store"; }
  location = /docs/api.html       {}
  location / {
    return 404;
  }

  # Used by the container's health check, and through it by `docker compose up --wait`.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
