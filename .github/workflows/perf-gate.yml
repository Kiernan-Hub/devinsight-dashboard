name: Performance Regression Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only: these jobs check out code and report pass/fail, and need nothing else.
permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # These cover the calculations behind every number the dashboard and the gate report.
      # They previously existed but nothing ran them.
      - name: Run tests
        run: npm test

  godot-tests:
    name: Godot unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same pinned download as benchmark-gate.yml. Kept duplicated rather than factored into a
      # shared setup because these are two independently useful, independently readable
      # workflows — a reviewer can open either one and see everything it does.
      - name: Download Godot (headless-capable)
        env:
          GODOT_VERSION: "4.7"
        run: |
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      # Covers the offline queue (batching, trimming, the flush/enqueue race) and the
      # benchmark's own pure decision logic. ascent/ isn't in this checkout, so the
      # logger-sync half of npm test skips here and only guards locally.
      - name: Run Godot tests
        run: npm run test:godot

  check-regression:
    name: FPS regression gate
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # SUPABASE_SERVICE_ROLE_KEY is the one that matters: the anon key is published in the
      # dashboard's JavaScript, so a gate reading with it is a gate any stranger can move by
      # inserting rows. The script falls back to the anon key with a loud warning if the
      # service-role secret is not set.
      - name: Check for FPS regression
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run check:regression
