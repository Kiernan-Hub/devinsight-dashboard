name: Docker

# Builds the ingest image, starts the whole local stack from docker-compose.yml, and pushes real
# telemetry through it (scripts/smoke.mjs). Unit tests stub the database out; this is the check
# that the handler, the schema, PostgREST and the gateway actually agree with each other.
#
# On a merge to main, the image that just passed is published to GitHub Container Registry,
# tagged with the commit it was built from.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Every job starts with no token permissions and asks for exactly what it uses.
permissions: {}

concurrency:
  # A newer push to the same pull request makes the older run's result irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `shell: bash` is not the same as leaving the shell unspecified. Unspecified, GitHub runs steps
# with `bash -e`, which does NOT set pipefail: `npm run smoke | tee summary` would then report
# tee's exit code — always success — and a failing smoke test would show up green. Naming bash
# explicitly gets `bash -eo pipefail`, so the first failing command in a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Third-party (and first-party) actions are pinned to a full commit SHA, with the version
      # it corresponds to in a comment. A tag like @v7 can be moved to point at different code
      # after the fact — which is exactly how the 2025 tj-actions/changed-files compromise
      # reached thousands of repositories. A SHA cannot be moved. Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes to the repository, so the token is not left behind in .git/config
          # for later steps to read.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Also the Docker build check: a Dockerfile that does not build fails here, on the PR.
      - name: Build and start the stack
        run: docker compose up --build --wait --wait-timeout 120

      - name: Smoke test (ingest → Postgres → REST API, and anon cannot write)
        run: |
          {
            echo '### Compose smoke test'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          npm run --silent smoke | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Database privilege and RLS invariants
        run: npm run test:db

      # schema.sql claims to be safe to re-run, and once was not (see its build_session_health
      # comment). Applying it twice more on top of a populated database, then re-checking
      # everything, is what keeps that claim true.
      - name: Schema re-applies cleanly
        run: |
          npm run db:migrate:local
          npm run db:migrate:local
          npm run test:db
          npm run --silent smoke

      # The FPS regression gate itself, end to end against a real database. In production it can
      # only be exercised when real players have produced telemetry for the declared builds — and
      # it cannot be at all while that database is unreachable. The seed contains a deliberate 18%
      # regression in the current build, so here the gate must find it: exit 1, verdict
      # "regression". A gate that passed this would pass a real regression too.
      - name: Regression gate catches the seeded regression
        run: |
          npm run --silent seed
          status=0
          GATE_RESULT_FILE=gate-result.json npm run --silent check:regression:local || status=$?
          if [ "$status" -ne 1 ] || ! jq -e '.status == "regression"' gate-result.json > /dev/null; then
            echo "::error::expected the gate to report the seeded regression (exit 1); got exit $status: $(cat gate-result.json 2> /dev/null)"
            exit 1
          fi
          echo "Gate correctly reported: $(jq -r .message gate-result.json)"

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Publish image to GHCR
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The only write permission in this file, and only on this job, only on main.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Registry paths must be lower-case; the GitHub account name is not.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devinsight-ingest" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GITHUB_TOKEN, scoped by `packages: write` above. No personal access token or long-lived
      # registry password is stored anywhere.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # sha-<full commit>: every published image traces back to exactly one commit. `latest`
          # is a convenience pointer to whatever main last built, nothing more.
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Signed build provenance (what source, which workflow, which inputs) and a software
          # bill of materials, attached to the image in the registry.
          provenance: mode=max
          sbom: true
